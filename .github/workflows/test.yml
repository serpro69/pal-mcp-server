name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PAL from its package metadata
        run: |
          python -m venv "$RUNNER_TEMP/pal"
          "$RUNNER_TEMP/pal/bin/python" -m pip install .

      - name: Connect to the installed server from a separate client environment
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv client
          client/bin/python -m pip install mcp==1.30.0
          client/bin/python -I "$GITHUB_WORKSPACE/scripts/check_installed_server.py" "$RUNNER_TEMP/pal/bin/pal-mcp-server"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          # Run only unit tests (exclude simulation tests and integration tests)
          # Integration tests require local-llama which isn't available in CI
          python -m pytest tests/ -v --ignore=simulator_tests/ -m "not integration"
        env:
          # Ensure no API key is accidentally used in CI
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Run strict local simulator contracts
        timeout-minutes: 5
        run: python -m simulator_tests.stub_provider

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check lock file freshness
        run: |
          pip-compile --strip-extras --no-header --quiet pyproject.toml -o requirements.txt
          pip-compile --strip-extras --no-header --quiet requirements-dev.in -o requirements-dev.txt
          git diff --exit-code requirements.txt requirements-dev.txt

      - name: Run black formatter check
        run: black --check . --exclude="test_simulation_files/"

      - name: Run ruff linter
        run: ruff check . --exclude test_simulation_files
