name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (no commit, no tag, no release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release

    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: ${{ vars.CLAUDE_TOOLBOX_APP_ID != '' || vars.JEAN_CLAWDER_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLAUDE_TOOLBOX_APP_ID || vars.JEAN_CLAWDER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_TOOLBOX_APP_KEY || secrets.JEAN_CLAWDER_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install toml build

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=simulator_tests/ -m "not integration"

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          NEXT="${major}.${minor}.${patch}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEXT (${{ inputs.bump }})"

      - name: Update pyproject.toml version
        if: ${{ !inputs.dry_run }}
        run: |
          python -c "
          import toml, pathlib
          p = pathlib.Path('pyproject.toml')
          data = toml.load(p)
          data['project']['version'] = '${{ steps.version.outputs.next }}'
          p.write_text(toml.dumps(data))
          "

      - name: Sync version to config.py
        if: ${{ !inputs.dry_run }}
        run: python scripts/sync_version.py

      - name: Build distribution
        if: ${{ !inputs.dry_run }}
        run: python -m build

      - name: Commit, tag, and push
        if: ${{ !inputs.dry_run }}
        run: |
          BOT_USER="${BOT_SLUG}[bot]"
          git config --local user.name "${BOT_USER}"
          git config --local user.email "${BOT_USER}@users.noreply.github.com"
          git add pyproject.toml config.py
          git commit -m "Release v${{ steps.version.outputs.next }}"
          git tag "v${{ steps.version.outputs.next }}"
          git push origin main --tags
        env:
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v${{ steps.version.outputs.next }}" dist/* \
            --title "v${{ steps.version.outputs.next }}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "Would bump: ${{ steps.version.outputs.current }} -> ${{ steps.version.outputs.next }} (${{ inputs.bump }})" >> $GITHUB_STEP_SUMMARY
          echo "No changes were made." >> $GITHUB_STEP_SUMMARY
