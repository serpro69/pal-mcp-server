version: 2
updates:
  # Python's layered, headerless pip-compile locks use python-updates.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep the image on Python 3.11 until a newer series builds with the lockfile.
      - dependency-name: python
        versions: [">= 3.12"]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
