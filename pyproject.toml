[project]
name = "pal-mcp-server"
version = "1.3.0"
description = "AI-powered MCP server with multiple model providers"
requires-python = ">=3.9"
dependencies = [ "mcp>=1.0.0,<2.0.0", "google-genai>=1.19.0", "openai>=2.0.0", "pydantic>=2.0.0", "python-dotenv>=1.0.0",]

[build-system]
requires = [ "setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2",]
build-backend = "setuptools.build_meta"

[project.scripts]
pal-mcp-server = "server:run"

[tool.setuptools]
py-modules = [ "server", "config",]

[tool.black]
line-length = 120
target-version = [ "py39", "py310", "py311", "py312", "py313",]
include = "\\.pyi?$"
extend-exclude = "/(\n  # directories\n  \\.eggs\n  | \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | \\.pal_venv\n  | venv\n  | _build\n  | buck-out\n  | build\n  | dist\n)/\n"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_glob = [ "venv/*", ".venv/*", ".pal_venv/*",]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.setuptools.package-data]
"*" = [ "conf/*.json", "conf/cli_clients/*.json", "systemprompts/clink/*.txt",]

[tool.setuptools.data-files]
conf = [ "conf/custom_models.json", "conf/openrouter_models.json", "conf/azure_models.json", "conf/openai_models.json", "conf/gemini_models.json", "conf/xai_models.json", "conf/dial_models.json",]

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "B", "C4", "UP",]
ignore = [ "E501", "B008", "C901", "B904",]

[tool.setuptools.packages.find]
include = [ "tools*", "providers*", "systemprompts*", "utils*", "conf*", "clink*",]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [ "F401",]
"tests/*" = [ "B011",]
"tests/conftest.py" = [ "E402",]
